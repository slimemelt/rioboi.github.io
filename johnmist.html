<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>john mist</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
    }

    /* Full-screen background */
    .background {
      position: fixed;
      inset: 0;
      z-index: -2;

      background-image: url("background.jpg");
      background-size: cover;
      background-position: center;
      filter: blur(3px);
      transform: scale(1.03);
    }

    /* Dark overlay */
    .background-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(0, 0, 0, 0.15);
    }

    /* Main narrow website */
    .site {
      width: 275px;
      min-height: 100vh;
      margin: 0 auto;
      background: #000;
      border-left: 1px solid #222;
      border-right: 1px solid #222;
    }

    /* Header image */
    .hero {
      height: 115px;
      position: relative;

      background-image: url("john.jpg");
      background-size: cover;
      background-position: center;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.08);
    }

    .hero-text {
      position: absolute;
      z-index: 1;
      top: 28px;
      left: 12px;
      right: 12px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      font-size: 16px;
      font-weight: 300;
      letter-spacing: 3px;
    }

    .hero-text .john {
      letter-spacing: 0;
      font-size: 14px;
    }

    /* Main content */
    .content {
      padding: 14px 12px 0;
      min-height: 255px;
    }

    .intro {
      line-height: 1.25;
      margin-bottom: 22px;
    }

    .home {
      color: #fff;
      text-decoration: underline;
    }

    .home:hover {
      color: #aaa;
    }

    /* Section image */
    .section-title {
      height: 32px;

      background-image: url("section.jpg");
      background-size: cover;
      background-position: center;

      border-top: 1px solid #333;
      border-bottom: 1px solid #333;

      color: #000;
      font-size: 18px;
      line-height: 32px;
      padding-left: 8px;

      text-transform: uppercase;
      letter-spacing: -1px;
    }

    /* Project */
    .project {
      padding: 10px 12px 12px;
      border-bottom: 1px solid #777;
    }

    .project-name {
      font-size: 17px;
      margin-bottom: 2px;
    }

    .project-info {
      font-size: 9px;
      line-height: 1.3;
      color: #ddd;
    }

    .watch {
      display: inline-block;
      margin-top: 4px;
      color: #00ff00;
      font-weight: bold;
      text-decoration: none;
    }

    .watch:hover {
      text-decoration: underline;
    }

    /* Bottom */
    footer {
      padding: 180px 12px 12px;
      font-size: 7px;
      color: #777;
      line-height: 1.3;
    }

    @media (max-width: 600px) {
      .site {
        width: 100%;
        max-width: 275px;
      }

      .background {
        background-position: center;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>
  <div class="background-overlay"></div>

  <main class="site">

    <header class="hero">
      <div class="hero-text">
        <span class="john">john</span>
        <span>MIST</span>
      </div>
    </header>

    <section class="content">

      <div class="intro">
        hello i am john mist<br>
        check out my website
      </div>

      <a class="home" href="/">
        home &gt;
      </a>

    </section>

    <section>

      <div class="section-title">
        THINGS I WORK ON
      </div>

      <article class="project">
        <div class="project-name">
          MIST
        </div>

        <div class="project-info">
          ai john mist
        </div>

        <a class="watch" href="#">
          watch
        </a>
      </article>

    </section>

    <footer>
      content destiny by john :D<br>
      www.????? &nbsp; | &nbsp; made on the internet
    </footer>

  </main>

</body>
</html>
